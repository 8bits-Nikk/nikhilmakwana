    <script>
      // Applies the stored (or system) theme before first paint so the page
      // never flashes the wrong colours. Mirrors THEME_STORAGE_KEY in
      // src/lib/theme-context.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        } catch (e) {
          /* localStorage unavailable — fall back to the light theme */
        }
      })()
    </script>
