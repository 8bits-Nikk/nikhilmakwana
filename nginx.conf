server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/font-woff2;

    # Hashed build output never changes, so it can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|ico|svg|woff2|pdf)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Contact API — proxied to the Nest service on the compose network. The
    # /api prefix is preserved (no trailing path on proxy_pass), matching the
    # global prefix set in server/src/main.ts.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API sets `trust proxy` and reads the client IP from this header;
        # without it the rate limiter would see every visitor as nginx.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Responses are per-request; never let a proxy cache them.
        add_header Cache-Control "no-store";
    }

    # Single page app — every other path falls back to index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
